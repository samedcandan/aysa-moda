name: Aysa Moda iOS Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Web Bundle
        run: npm run build:mobile || npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://aysamoda.karneyn.com

      - name: Sync Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup App Store Connect Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Build Xcode Archive
        run: |
          PROJ_FLAG="-project ios/App/App.xcodeproj"
          if [ -d "ios/App/App.xcworkspace" ]; then
            PROJ_FLAG="-workspace ios/App/App.xcworkspace"
          fi
          xcodebuild $PROJ_FLAG -scheme App -sdk iphoneos -configuration Release -archivePath $PWD/build/AysaModa.xcarchive clean archive DEVELOPMENT_TEAM=S79285KHV9 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Export Signed IPA Package
        run: |
          xcodebuild -exportArchive \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -archivePath $PWD/build/AysaModa.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/

      - name: Find IPA File
        run: |
          IPA_FILE=$(find build -name "*.ipa" | head -n 1)
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AysaModa-iOS-IPA
          path: ${{ env.IPA_PATH }}

      - name: Upload to App Store Connect TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
