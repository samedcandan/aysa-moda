name: Aysa Moda iOS Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Web Bundle
        run: npm run build:mobile || npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://aysamoda.karneyn.com

      - name: Sync Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Temporary Keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=actions
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

      - name: Setup App Store Connect Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cat << 'EOF' > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EOF

      - name: Build & Export Signed IPA
        run: |
          PROJ_FLAG="-project ios/App/App.xcodeproj"
          if [ -d "ios/App/App.xcworkspace" ]; then
            PROJ_FLAG="-workspace ios/App/App.xcworkspace"
          fi
          
          xcodebuild $PROJ_FLAG \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/AysaModa.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            DEVELOPMENT_TEAM=S79285KHV9 \
            clean archive

          xcodebuild -exportArchive \
            -archivePath $PWD/build/AysaModa.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Find IPA File
        run: |
          IPA_FILE=$(find build -name "*.ipa" | head -n 1)
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AysaModa-iOS-IPA
          path: ${{ env.IPA_PATH }}

      - name: Upload to App Store Connect TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
